name: Extraer proyecto Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'AforoTanque2026_MODIFICADO_CORREGIDO_v2.zip'
      - '.github/workflows/extraer-proyecto.yml'

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer ZIP y localizar proyecto
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf /tmp/aforo-extraido
          mkdir -p /tmp/aforo-extraido
          unzip -q "$ZIP" -d /tmp/aforo-extraido
          echo "=== CONTENIDO DEL ZIP ==="
          find /tmp/aforo-extraido -type f | sort | head -500

          SETTINGS="$(find /tmp/aforo-extraido -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$SETTINGS"
          PROJECT_ROOT="$(dirname "$SETTINGS")"
          echo "=== PROYECTO ENCONTRADO: $PROJECT_ROOT ==="

          cp -a "$PROJECT_ROOT"/. .
          test -f settings.gradle.kts -o -f settings.gradle
          test -d app
          echo "=== PROYECTO COPIADO ==="
          find . -maxdepth 4 -type f ! -path './.git/*' ! -name '*.zip' | sort | head -500

      - name: Guardar proyecto en main
        shell: bash
        run: |
          set -euxo pipefail
          # El ZIP trae un workflow de compilación que no puede ser creado
          # por el GITHUB_TOKEN de este workflow. Lo instalaremos después
          # mediante la conexión GitHub con los permisos adecuados.
          rm -f .github/workflows/compilar.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extraer proyecto Android desde ZIP" || echo "No hay cambios para commit."
          git push origin HEAD:main
