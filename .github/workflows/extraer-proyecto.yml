name: Extraer proyecto Android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extraer:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extraer ZIP
        shell: bash
        run: |
          set -euxo pipefail
          ZIP="$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)"
          test -n "$ZIP"
          rm -rf /tmp/aforo-extraido
          mkdir -p /tmp/aforo-extraido
          unzip -q "$ZIP" -d /tmp/aforo-extraido
          echo "Contenido del ZIP:"
          find /tmp/aforo-extraido -maxdepth 4 -type f | sort | head -300

      - name: Localizar y copiar proyecto
        shell: bash
        run: |
          set -euxo pipefail
          SETTINGS="$(find /tmp/aforo-extraido -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print -quit)"
          test -n "$SETTINGS"
          PROJECT_ROOT="$(dirname "$SETTINGS")"
          echo "Proyecto: $PROJECT_ROOT"
          cp -a "$PROJECT_ROOT"/. .
          test -f settings.gradle.kts -o -f settings.gradle
          test -d app
          echo "Proyecto Android copiado correctamente."
          find . -maxdepth 3 -type f ! -path './.git/*' ! -name '*.zip' | sort | head -300

      - name: Guardar proyecto en main
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Extraer proyecto Android desde ZIP" || echo "No hay cambios para commit."
          git push origin HEAD:main
